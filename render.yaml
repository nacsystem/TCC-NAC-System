# Deploy automático no Render (Blueprint): cria o site + o banco PostgreSQL.
services:
  - type: web
    name: nac-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nac-banco
          property: connectionString
      - key: ADMIN_SENHA
        sync: false        # você digita no painel (até 8 números)
      - key: TRUST_PROXY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"

databases:
  - name: nac-banco
    databaseName: nac
    user: nac
